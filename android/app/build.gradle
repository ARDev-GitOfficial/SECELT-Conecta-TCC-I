plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def portalUrl = providers.gradleProperty('portalUrl')
    .orElse(providers.gradleProperty('portalApiUrl'))
    .orElse('https://secelt-conecta-demo.netlify.app')
    .get()
    .trim()
    .replaceFirst('/+$', '')
def portalAddress = new URI(portalUrl)
if (!(portalAddress.scheme in ['http', 'https']) || !portalAddress.host || portalAddress.userInfo ||
    portalAddress.path || portalAddress.query != null || portalAddress.fragment != null ||
    portalAddress.port == 0 || portalAddress.port > 65535) {
    throw new GradleException('portalUrl deve ser a origem HTTP ou HTTPS do portal.')
}

android {
    namespace 'br.gov.secel.conecta'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    defaultConfig {
        applicationId 'br.gov.secel.conecta'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.5.0'
        buildConfigField 'String', 'PORTAL_URL', "\"$portalUrl\""
        manifestPlaceholders = [portalUsesCleartext: portalAddress.scheme == 'http']
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}


